{% extends "watchtogether/wt_base.html" %}

{% block title %}Đăng ký - WatchTogether{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col justify-center items-center p-6 relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl rounded-[2rem] p-8 shadow-2xl border border-slate-700/50 relative z-10">
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg border-4 border-slate-800 mb-5">
                <i class="fa-solid fa-user-plus text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Tạo Tài Khoản</h1>
            <p class="text-slate-400 text-sm mt-2 font-medium">Bắt đầu mời bạn bè xem chung</p>
        </div>
        
        <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-3 rounded-xl mb-5 text-center font-semibold"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-2 ml-1">Tên đăng nhập / ID</label>
                <input type="text" id="username" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="Chọn một biệt danh">
            </div>
            <div>
                <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-2 ml-1">Mật khẩu</label>
                <input type="password" id="password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-2 ml-1">Nhập lại mật khẩu</label>
                <input type="password" id="confirm_password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="••••••••">
            </div>
            
            <div class="pt-6 space-y-3">
                <button onclick="handleRegister()" id="reg-btn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-[0.98]">Đăng Ký Khởi Tạo</button>
                <div class="text-center pt-3">
                    <a href="{{ url_for('watchtogether.index') }}" class="text-sm text-slate-400 hover:text-white transition-colors">Đã có tài khoản? <b>Đăng nhập</b></a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function handleRegister() {
    const un = document.getElementById('username').value.trim();
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;
    const err = document.getElementById('error-msg');
    const btn = document.getElementById('reg-btn');
    
    if(!un || !pw) {
        err.textContent = "Vui lòng nhập đầy đủ tên và mật khẩu";
        err.classList.remove('hidden');
        return;
    }
    
    if(pw !== cpw) {
         err.textContent = "Mật khẩu xác nhận không khớp";
         err.classList.remove('hidden');
         return;
    }
    
    // Nút loading UI state
    const originalText = btn.innerText;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    btn.disabled = true;

    try {
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        const res = await fetch('/watchtogether/api/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({username: un, password: pw})
        });
        const data = await res.json();
        
        if (data.success) {
            window.location.href = '/watchtogether/';
        } else {
            err.textContent = data.message || "Có lỗi xảy ra";
            err.classList.remove('hidden');
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    } catch (e) {
        err.textContent = "Lỗi kết nối máy chủ";
        err.classList.remove('hidden');
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
</script>
{% endblock %}
