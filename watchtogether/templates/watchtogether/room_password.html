{% extends "watchtogether/wt_base.html" %}
{% block title %}Nhập Mật Khẩu Phòng - WatchTogether{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col justify-center items-center p-6 relative overflow-hidden">
    <div class="w-full max-w-sm bg-slate-800/80 backdrop-blur-xl rounded-[2rem] p-8 shadow-2xl border border-slate-700/50 relative z-10 text-center">
        <div class="w-20 h-20 mx-auto bg-amber-500/20 rounded-2xl flex items-center justify-center shadow-lg border-2 border-amber-500/50 mb-5">
            <i class="fa-solid fa-lock text-3xl text-amber-500"></i>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight mb-2">Phòng Cần Mật Khẩu</h1>
        <p class="text-slate-400 text-sm mb-6">Phòng <strong class="text-white">{{ room.name }}</strong> đã được cài đặt khoá bảo vệ.</p>
        
        <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-3 rounded-xl mb-5 text-center font-semibold"></div>

        <div class="space-y-4">
            <input type="password" id="room-pass" placeholder="Nhập mật khẩu phòng" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-center text-white font-medium focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all placeholder:text-slate-600">
            
            <button onclick="unlockRoom()" id="unlock-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-[0.98]">
                Khoá Mở Vừng Ơi
            </button>
            <a href="/watchtogether/" class="block pt-3 text-sm text-slate-400 hover:text-white transition-colors">Quay lại Dashboard</a>
        </div>
    </div>
</div>

<script>
async function unlockRoom() {
    const pw = document.getElementById('room-pass').value.trim();
    if(!pw) return;
    
    const err = document.getElementById('error-msg');
    const btn = document.getElementById('unlock-btn');
    const originalText = btn.innerText;
    
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    btn.disabled = true;

    try {
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        const res = await fetch('/watchtogether/api/room/{{ room.id }}/unlock', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        
        if(res.ok && data.success) {
            window.location.reload();
        } else {
            err.textContent = data.message || "Mật khẩu không đúng";
            err.classList.remove('hidden');
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    } catch(e) {
        err.textContent = "Lỗi kết nối";
        err.classList.remove('hidden');
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
</script>
{% endblock %}
