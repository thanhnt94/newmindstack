{% extends "watchtogether/wt_base.html" %}

{% block title %}Đăng nhập - WatchTogether{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col justify-center items-center p-6 relative overflow-hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl rounded-[2rem] p-8 shadow-2xl border border-slate-700/50 relative z-10">
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg border-4 border-slate-800 mb-5">
                <i class="fa-solid fa-tv text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">WatchTogether</h1>
            <p class="text-slate-400 text-sm mt-2 font-medium">Xem Youtube đồng bộ cùng bạn bè</p>
        </div>
        
        <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-3 rounded-xl mb-5 text-center font-semibold"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-2 ml-1">Tên đăng nhập / ID</label>
                <input type="text" id="username" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="Biệt danh của bạn">
            </div>
            <div>
                <label class="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-2 ml-1">Mật khẩu</label>
                <input type="password" id="password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600" placeholder="••••••••">
            </div>
            
            <div class="pt-6 space-y-3">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-indigo-500/25 active:scale-[0.98]">Đăng nhập</button>
                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
                    <div class="relative flex justify-center text-xs"><span class="bg-slate-800 px-2 text-slate-500 font-bold uppercase tracking-widest">Hoặc</span></div>
                </div>
                <button onclick="handleRegister()" class="w-full bg-slate-700/50 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3.5 rounded-xl transition-all active:scale-[0.98]">Tạo tài khoản tự động</button>
            </div>
        </div>
    </div>
</div>

<script>
const requestedRoomId = "{{ room_id if room_id else '' }}";

async function authCall(url) {
    const un = document.getElementById('username').value.trim();
    const pw = document.getElementById('password').value;
    const err = document.getElementById('error-msg');
    const btn = event.currentTarget;
    
    if(!un || !pw) {
        err.textContent = "Vui lòng nhập đầy đủ tên và mật khẩu";
        err.classList.remove('hidden');
        return;
    }
    
    const originalText = btn.innerText;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    btn.disabled = true;

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: un, password: pw})
        });
        const data = await res.json();
        
        if (data.success) {
            if (requestedRoomId) {
                window.location.href = `/watchtogether/room/${requestedRoomId}`;
            } else {
                window.location.href = '/watchtogether/';
            }
        } else {
            err.textContent = data.message || "Có lỗi xảy ra";
            err.classList.remove('hidden');
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    } catch (e) {
        err.textContent = "Lỗi kết nối máy chủ";
        err.classList.remove('hidden');
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

function handleLogin() { authCall('/watchtogether/api/login'); }
function handleRegister() { authCall('/watchtogether/api/register'); }
</script>
{% endblock %}
